<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <!-- 1. Meta refresh chuyển hướng ngay lập tức (0 giây) -->
  <meta http-equiv="refresh" content="0; url=https://war-of-genesis-helper.web.app/">
  <link rel="canonical" href="https://war-of-genesis-helper.web.app/">
  <title>Đang chuyển hướng sang War of Genesis Helper...</title>
  
  <!-- 2. Giữ nguyên các tham số query và hash nếu có -->
  <script>
    const newBase = "https://war-of-genesis-helper.web.app";
    const path = window.location.pathname.replace(/^\/war-of-genesis-helper\/?/, '/');
    const target = newBase + (path === '/' ? '' : path) + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body style="background:#0d1117; color:#c9d1d9; font-family:sans-serif; text-align:center; padding-top:60px;">
  <div style="font-size:36px; margin-bottom:14px;">⚔️</div>
  <h2 style="color:#f0f6fc;">Trang Web Đã Chuyển Sang Địa Chỉ Mới Chính Thức</h2>
  <p style="color:#8b949e;">Đang tự động chuyển hướng bạn trong giây lát...</p>
  <p style="margin-top:20px;">
    Nếu trình duyệt không tự chuyển, vui lòng bấm vào liên kết dưới đây:<br>
    <a href="https://war-of-genesis-helper.web.app" style="color:#58a6ff; font-size:18px; font-weight:bold; text-decoration:underline; display:inline-block; margin-top:8px;">
      👉 https://war-of-genesis-helper.web.app
    </a>
  </p>
</body>
</html>
